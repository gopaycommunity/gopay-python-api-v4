[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "gopay-payments-v4"
description = "GoPay Payments API v4 — Python server-side SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GoPay s.r.o." }]
# Same floor as the v3 SDK (`gopay`), so a merchant can move to v4 without a runtime
# upgrade. Every newer interpreter must keep working: CI runs the whole matrix.
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "typing_extensions>=4.7",
]
dynamic = ["version"]
keywords = ["gopay", "payments", "payment-gateway", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gopaycommunity/gopay-python-api-v4"
Documentation = "https://api-docs.gopay.com/"
Changelog = "https://github.com/gopaycommunity/gopay-python-api-v4/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

# The version lives in the git tag semantic-release creates — nothing in the source tree
# is edited by hand to release, so the published version and the User-Agent cannot drift.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "CHANGELOG.md", "LICENSE", "MIGRATION.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/gopay_payments"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]
# Generated from the spec; fixing it by hand would be undone by the next codegen.
extend-exclude = ["src/gopay_payments/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "TRY", "C4", "PIE", "RET"]
ignore = [
    "TRY003",  # messages are part of the error contract, kept next to the raise
    "UP006",   # list[...] is fine; but Optional/Union stay for 3.9 runtime annotations
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603", "S607", "S310"]

[tool.mypy]
# mypy no longer accepts a 3.9 target; the 3.9 floor is enforced by running the
# test suite on a 3.9 interpreter and by ruff's py39 target.
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: calls a live GoPay environment (needs GOPAY_PAYMENTS_V4_* variables)",
]

[tool.coverage.run]
source = ["gopay_payments"]
omit = ["*/_generated.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
