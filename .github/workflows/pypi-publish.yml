# Publishes gopay-payments-v4 to PyPI from a release tag.
# Tags come from the Bitbucket "Mirror to GitHub" step; semantic-release creates them as <x.y.z>.
# Trusted publishing (OIDC) only — never add a PYPI_TOKEN secret.
#
# Two jobs, so that the build backend (hatchling, hatch-vcs) and twine never run where a PyPI
# token can be minted: `build` has no id-token permission and hands its files over as an
# artifact; `publish` has id-token: write and only uploads them, with an action pinned to a SHA
# and nothing installed from PyPI.

name: Publish to PyPI

run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  # `create`, not `push`: release commits carry [skip ci], which GitHub honours on push but not on create.
  create:
  # Manual runs, and the only way to publish a tag that already existed on GitHub.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. 1.2.0"
        required: true
        type: string
      dry-run:
        description: "Build and check only — do not publish"
        required: false
        default: true
        type: boolean

concurrency:
  group: pypi-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  UV_VERSION: "0.12.23"

jobs:
  build:
    name: Build ${{ inputs.tag || github.ref_name }}
    # `create` also fires for branches; only release tags are published.
    if: github.event_name != 'create' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Before checkout, so a bad dispatch input is rejected before use as a git ref.
      - name: Validate tag
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (expected <x.y.z>)."
            exit 1
          fi

      # Actions are pinned to a SHA, not a tag: a tag can be moved.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.TAG }}
          # hatch-vcs derives the version from the tag, so the history has to be there.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Build
        run: ~/.local/bin/uv build

      - name: Verify the built version matches the tag
        run: |
          set -euo pipefail
          expected="dist/gopay_payments_v4-${TAG}-py3-none-any.whl"
          built=$(printf '%s ' dist/*)
          if [ ! -f "$expected" ]; then
            echo "::error::Expected $expected, built: $built"
            exit 1
          fi
          echo "Built $built"

      - name: Check distributions
        run: ~/.local/bin/uvx --from "twine==7.0.0" twine check --strict dist/*

      - name: Hand the distributions to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ inputs.tag || github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    # The PyPI trusted publisher is registered for this workflow and this environment.
    environment: pypi
    permissions:
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry-run || false }}
      # Gates the publish step, not the job, so disarmed runs still build and verify.
      ARMED: ${{ vars.GOPAY_PYPI_PUBLISH == 'true' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish (dry run)
        if: env.DRY_RUN == 'true' || env.ARMED != 'true'
        run: |
          echo "::warning::NOT published — dry run or GOPAY_PYPI_PUBLISH is not 'true'. Built and checked $TAG only."

      # Nothing is installed in this job: the PyPA action ships its own pinned tooling, and the
      # action itself is pinned to a commit SHA. skip-existing keeps a re-delivered tag harmless.
      - name: Publish to PyPI
        if: env.DRY_RUN != 'true' && env.ARMED == 'true'
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          skip-existing: true
