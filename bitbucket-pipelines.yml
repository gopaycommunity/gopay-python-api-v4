image: python:3.13-slim

definitions:
  caches:
    uv: ~/.cache/uv

  steps:
    - step: &lint
        name: Lint and types
        caches:
          - uv
        script:
          - pip install --quiet "uv==0.12.23"
          - uv sync --frozen
          - uv run ruff format --check src tests scripts examples
          - uv run ruff check src tests scripts examples
          - uv run mypy

    - step: &test
        name: Unit tests (Python 3.9–3.14)
        caches:
          - uv
        script:
          - pip install --quiet "uv==0.12.23"
          # The floor is 3.9 (as the v3 SDK) and every newer interpreter must keep working.
          - for v in 3.9 3.10 3.11 3.12 3.14; do uv run --frozen --python "$v" pytest -q -p no:cacheprovider || exit 1; done
          - uv run --frozen --python 3.13 pytest -q --cov --cov-report=xml:coverage.xml
        artifacts:
          - coverage.xml

    - step: &test-315
        name: Unit tests (Python 3.15)
        # The pinned uv has no 3.15.0 build to download, so this step runs on the official
        # image and uses its interpreter. Fold it into the loop above once uv is bumped to a
        # release that has one.
        image: python:3.15-slim
        caches:
          - uv
        script:
          - pip install --quiet "uv==0.12.23"
          - uv run --frozen --python-preference only-system --python 3.15 pytest -q -p no:cacheprovider

    - step: &e2e
        name: E2E
        # Self-hosted, inside GoPay's network, like the PHP SDK's E2E step: the gateway the
        # repository variables point at is not reachable from Bitbucket's cloud runners
        # (connect timeout on the first run).
        runs-on:
          - self.hosted
          - linux
          - gopay.dev.2x
        caches:
          - uv
        script:
          - pip install --quiet "uv==0.12.23"
          # GOPAY_PAYMENTS_V4_CLIENT_ID / _CLIENT_SECRET / _GOID (and optionally _BASE_URL):
          # secured repository variables. The suite refuses production on its own.
          - uv run --frozen pytest -m e2e -q

    - step: &audit
        name: Dependency audit
        caches:
          - uv
        script:
          - pip install --quiet "uv==0.12.23"
          # Runtime dependencies only: they are what ships to merchants.
          - uv export --frozen --no-dev --no-emit-project --format requirements-txt -o runtime-requirements.txt
          - uvx --from "pip-audit>=2.7" pip-audit --strict -r runtime-requirements.txt

    - step: &sonar
        name: Analyze on SonarCloud
        size: 2x
        services:
          - docker2x
        clone:
          depth: full
        script:
          - pipe: sonarsource/sonarcloud-scan:4.1.0
            variables:
              SONAR_SCANNER_OPTS: -Xmx2560m
              EXTRA_ARGS: -Dsonar.projectKey=gp-gopay_gopay-python-api-v4
                -Dsonar.organization=gp-gopay
                -Dsonar.sources=src
                -Dsonar.exclusions=src/gopay_payments/_generated.py
                -Dsonar.tests=tests
                -Dsonar.python.version=3.9,3.10,3.11,3.12,3.13,3.14,3.15
                -Dsonar.python.coverage.reportPaths=coverage.xml
          - pipe: sonarsource/sonarcloud-quality-gate:0.2.0

    - step: &release-preview
        name: Release preview (dry-run)
        # Pinned by digest, like the release tools in package-lock.json: the release step
        # below holds the push token, and this one checks exactly what it will run.
        image: &node-image node:22.23.3-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
        clone:
          depth: full
        script:
          - npm ci --ignore-scripts --no-audit --no-fund
          # --branches: the config releases only from master, so without it the dry-run would
          # report "not a release branch" on every PR and check nothing.
          - ./node_modules/.bin/semantic-release --dry-run --no-ci --branches "$BITBUCKET_BRANCH"

    - step: &release
        name: Release
        image: *node-image
        deployment: production
        clone:
          depth: full
        script:
          # This step holds the push token, so nothing in it may float to a new release: the
          # image is pinned by digest and every package, transitive ones included, by
          # package-lock.json. --ignore-scripts: no package runs code at install time.
          # The preset stays on 9.x: 10.x needs conventional-changelog-writer 9, while the
          # semantic-release plugins still bring writer 8.
          - npm ci --ignore-scripts --no-audit --no-fund
          # The token goes into the remote only after the install.
          - git remote set-url origin https://gopay-release-bot:$BITBUCKET_BOT_PUSH_TOKEN@bitbucket.org/$BITBUCKET_REPO_FULL_NAME.git
          - ./node_modules/.bin/semantic-release
        artifacts:
          - CHANGELOG.md

    - step: &github-sync
        name: Mirror to GitHub
        image: *node-image
        clone:
          depth: full
        script:
          # Pushes with this repository's SSH key (Repository settings → Pipelines → SSH keys,
          # github.com under Known hosts), a deploy key with write access on the GitHub mirror —
          # the same as the other v4 SDK mirrors.
          - git fetch origin master --tags
          - git remote add github git@github.com:gopaycommunity/gopay-python-api-v4.git
          - git push github refs/remotes/origin/master:refs/heads/master --force
          # Every tag on master that GitHub does not have yet, not just the one at the tip, so a
          # tag from a run that never got here follows with the next one. One tag per push: GitHub
          # emits no create event for a push carrying more than three tags, and the PyPI workflow
          # runs on create — so each tag pushed here is published while GOPAY_PYPI_PUBLISH is on.
          - git ls-remote --tags --refs github | cut -f2 > github-tags.txt
          - for t in $(git tag --merged refs/remotes/origin/master --sort=v:refname); do grep -qxF "refs/tags/$t" github-tags.txt || git push github "refs/tags/$t" || exit 1; done

  services:
    docker2x:
      type: docker
      memory: 4096

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *lint
          - step: *test
          - step: *test-315
          - step: *e2e
          - step: *audit
      - step: *sonar
      - step: *release-preview

  branches:
    master:
      - parallel:
          - step: *lint
          - step: *test
          - step: *test-315
          - step: *e2e
          - step: *audit
      - step: *sonar
      - step: *release
      - step: *github-sync
